<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F2EA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sayable" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <!-- Fonts per DESIGN.md: Newsreader (messages/serif), Hanken Grotesk (UI). -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=newsreader:400,400i,500,500i|hanken-grotesk:400,500,600&display=swap"
      rel="stylesheet"
    />
    <title>Sayable</title>
    <meta name="description" content="Say the hard thing so it can actually be heard." />
    <!-- Theme: set data-theme before paint so dark users never see a light flash.
         localStorage override, else the OS preference. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("sayable.theme");
          if (t !== "light" && t !== "dark") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#17140F" : "#F6F2EA");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
